# roles/master/tasks/main.yml

# ============================================================
# 1. Installation de Helm
# ============================================================

- name: Télécharger le binaire Helm
  ansible.builtin.get_url:
    url: "https://get.helm.sh/helm-{{ helm_version }}-linux-amd64.tar.gz"
    dest: "/tmp/helm.tar.gz"
    mode: "0644"

- name: Extraire Helm
  ansible.builtin.unarchive:
    src: "/tmp/helm.tar.gz"
    dest: "/tmp"
    remote_src: yes

- name: Copier le binaire Helm dans /usr/local/bin
  ansible.builtin.copy:
    src: "/tmp/linux-amd64/helm"
    dest: "/usr/local/bin/helm"
    mode: "0755"
    remote_src: yes

- name: Nettoyer les fichiers temporaires Helm
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/helm.tar.gz
    - /tmp/linux-amd64

# ============================================================
# 2. Initialisation du cluster Kubernetes
# ============================================================

- name: Initialiser le Cluster (kubeadm init)
  ansible.builtin.command: kubeadm init --pod-network-cidr={{ pod_network_cidr }}
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: Créer le répertoire .kube pour l'utilisateur '{{ ansible_user }}'
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Copier le fichier admin.conf vers .kube/config
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

# ============================================================
# 3. Installation de Calico via Helm UNIQUEMENT
#    (ne pas appliquer le manifest tigera-operator.yaml
#     manuellement — Helm crée toutes les ressources
#     avec les labels ownership requis)
# ============================================================

- name: Installer Calico via Helm (Tigera Operator + CRDs inclus)
  kubernetes.core.helm:
    name: calico
    chart_ref: "https://github.com/projectcalico/calico/releases/download/{{ calico_ver }}/tigera-operator-{{ calico_ver }}.tgz"
    release_namespace: tigera-operator
    create_namespace: true
    wait: true
    wait_timeout: "300s"
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    values:
      installation:
        cni:
          type: Calico
        calicoNetwork:
          ipPools:
            - blockSize: 26
              cidr: "{{ pod_network_cidr }}"
              encapsulation: VXLANCrossSubnet
              natOutgoing: Enabled
              nodeSelector: all()

- name: Attendre que les pods calico-node soient Running
  ansible.builtin.command: >
    kubectl get pods -n calico-system
    -l app.kubernetes.io/name=calico-node
    --field-selector=status.phase=Running
    --no-headers
  environment:
    KUBECONFIG: "/home/{{ ansible_user }}/.kube/config"
  register: calico_check
  until: calico_check.stdout_lines | length > 0
  retries: 30
  delay: 10
  changed_when: false

# ============================================================
# 4. Génération du token pour les workers
# ============================================================

- name: Créer le token de jonction
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_output

- name: Stocker la commande de join dans une variable globale
  ansible.builtin.add_host:
    name: "K8S_TOKEN_HOLDER"
    join_cmd: "{{ join_command_output.stdout }}"
