# roles/master/tasks/main.yml

- name: Télécharger et installer la clé GPG de Helm
  ansible.builtin.get_url:
    url: https://packages.buildkite.com/helm-linux/helm-debian/gpgkey
    dest: /etc/apt/keyrings/helm.asc
    mode: '0644'
    force: yes

- name: Ajouter le dépôt stable de Helm (Baltic)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/helm.asc] https://packages.buildkite.com/helm-linux/helm-debian/any/ any main"
    filename: helm-stable
    state: present

- name: Installer le paquet Helm
  ansible.builtin.apt:
    name: helm
    state: present
    update_cache: yes

- name: Installer les dépendances Python pour les modules K8s/Helm
  ansible.builtin.apt:
    name:
      - python3-kubernetes
      - python3-yaml
      - python3-jsonpatch # Souvent requis pour les modifs de ressources
    state: present
    update_cache: yes

- name: Initialiser le Cluster (kubeadm init)
  # Utilise la variable globale pod_network_cidr
  command: kubeadm init --pod-network-cidr={{ pod_network_cidr }}
  args:
    creates: /etc/kubernetes/admin.conf
  register: kubeadm_init

- name: Configurer .kube pour l'utilisateur '{{ ansible_user }}'
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: 0755

- name: Copier le fichier admin.conf
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"



- name: Ajouter le dépôt Helm Calico
  become: yes
  become_user: "{{ ansible_user }}"
  community.kubernetes.helm_repository:
    name: projectcalico
    repo_url: "https://docs.tigera.io/calico/charts"
    force_update: yes # Force le rafraîchissement de l'index

- name: Créer le namespace pour l'opérateur Tigera
  become: yes
  become_user: "{{ ansible_user }}"
  kubernetes.core.k8s:
    name: tigera-operator
    api_version: v1
    kind: Namespace
    state: present
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"

- name: Installer Calico via Helm
  # On s'assure d'être l'utilisateur qui possède le kubeconfig
  become: yes
  become_user: "{{ ansible_user }}"
  community.kubernetes.helm:
    name: calico
    chart_ref: projectcalico/tigera-operator
    release_namespace: tigera-operator
    # On pointe le fichier exact, au cas où le HOME ne serait pas setté
    kubeconfig: "/home/{{ ansible_user }}/.kube/config"
    values:
      tolerations:
        - effect: NoSchedule
          operator: Exists



